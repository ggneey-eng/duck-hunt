<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ördek Avı 🦆</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            #fffdf8 0%,
            #fff8ed 45%,
            #fdf3e5 100%
        );

    font-family: Georgia, "Times New Roman", serif;
    color: #3f2d21;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.container {
    width: 90%;
    max-width: 430px;
    padding: 35px 20px;
}


/* ÖRDEK GÖRSELİ */

.ducks {
    width: 100%;
    margin-bottom: 5px;
}

.ducks img {
    display: block;
    width: 100%;
    max-width: 190px;
    height: auto;
    margin: 0 auto;
}


/* BAŞLIK */

h1 {
    font-size: 48px;
    font-weight: normal;
    margin: 10px 0 15px;
}

.heart {
    color: #df6b6b;
    font-size: 25px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 28px;
}


/* KOD GİRİŞİ */

.input-wrapper {
    width: 100%;

    background: rgba(255,255,255,0.75);

    border: 2px solid #ead4b8;
    border-radius: 40px;

    padding: 4px;

    display: flex;
    align-items: center;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px
        rgba(91, 62, 38, 0.06);
}

.lock {
    font-size: 20px;
    margin-left: 18px;
}

input {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    padding: 17px 15px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    color: #3f2d21;

    text-align: center;

    text-transform: uppercase;
}

input::placeholder {
    color: #ad9b89;
    text-transform: none;
}


/* BUTON */

button {
    width: 75%;

    border: none;
    border-radius: 40px;

    padding: 17px;

    background:
        linear-gradient(
            135deg,
            #e47777,
            #d95f66
        );

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 9px 22px
        rgba(199, 84, 91, 0.22);

    transition: 0.2s;
}

button:active {
    transform: scale(0.97);
}


/* ÖRDEK MESAJI */

#message {
    min-height: 25px;

    margin: 25px auto 0;

    font-size: 17px;
    line-height: 1.7;

    white-space: pre-wrap;

    max-width: 380px;
}

#message.found {
    background:
        rgba(255,255,255,0.55);

    border:
        1px solid #ead4b8;

    border-radius: 22px;

    padding: 22px;

    box-shadow:
        0 8px 25px
        rgba(91, 62, 38, 0.06);
}


/* EN ALTTAKİ KÜÇÜK YAZI */

.tiny {
    margin-top: 35px;

    font-size: 12px;

    opacity: 0.45;
}


/* TELEFON */

@media (max-width: 500px) {

    h1 {
        font-size: 42px;
    }

    .subtitle {
        font-size: 17px;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- ÖRDEKLER -->

    <div class="ducks">

        <img
            src="ducks.png"
            alt="İki küçük ördek"
        >

    </div>


    <!-- BAŞLIK -->

    <h1>Ördek Avı</h1>

    <div class="heart">
        — ♡ —
    </div>


    <p class="subtitle">

        Küçük ördekler büyük sürprizler saklar...

        <br>

        Bir ördek buldun mu?

    </p>


    <!-- KOD GİRİŞİ -->

    <div class="input-wrapper">

        <span class="lock">
            ♡
        </span>

        <input
            id="duckCode"
            type="text"
            placeholder="Kodu buraya yaz..."
            autocomplete="off"
            maxlength="20"
        >

    </div>


    <!-- BUTON -->

    <button onclick="openDuck()">

        Ördeği Aç ♡

    </button>


    <!-- MESAJ BURADA ÇIKACAK -->

    <div id="message"></div>


    <!-- ALT YAZI -->

    <div class="tiny">

        🦆 dikkat: ördekler beklenmedik yerlerde ortaya çıkabilir

    </div>


</div>


<script>

/*
=================================================
            🦆 ÖRDEKLER BURADA 🦆
=================================================

*/


const ducks = {

       "1224": `İlk ördeğini buldun 🦆❤️

Evinde saklı birkaç ördek daha var. Umarım onları ararken
bana sövmezsin. Çok da aramaya çalışma, bırak onlar karşına 
çıksın. Çünkü bir süre sonra ben de nereye sakladığımı unutacağım 
muhtemelen. Ya da çok az saklayabileceğim... 
Seni çok seviyorum. ❤️`,

      "0915": `Seni ve bana yaptığın yemekleri seviyorum.
Senin elinden yediğim her yemek, yediğim en güzel "o" yemek.`,
    
      "9899": `Seni ve sana "benim" diyebilmeyi seviyorum. 
Benim sevgilim, benim karım, benim kadınım, benim evim, benim her şeyim.`,

    "2107": `Seni ve dinlediğim şarkıda seni aramayı seviyorum. 
Baktığım her yerde, dinlediğim her şarkıda, aklımdaki her düşüncede sen varsın.`,

    "1008": `Seni ve seninle saatlerce telefonda konuşmayı seviyorum. 
Yıllar sonra bulmuşken seni, aramızda 28 yılın muhabbeti var kapatmamız gereken. 
Saatlerce konuş sen, saatlerce dinleyeyim seni. Bazen hiçbir şey söyleme, ben yine
dinlerim sessizliğini`
        

};



function openDuck() {

    const input =
        document.getElementById("duckCode");

    const message =
        document.getElementById("message");

    const code =
        input.value
        .trim()
        .toUpperCase();


    /* KOD YAZILMADI */

    if (!code) {

        message.textContent =
            "Önce bir ördek bulman lazım 🦆";

        message.classList.remove("found");

        return;
    }


    /* ÖRDEK BULUNDU */

    if (ducks[code]) {

        message.textContent =
            ducks[code];

        message.classList.add("found");

        input.value = "";

    }


    /* YANLIŞ KOD */

    else {

        message.textContent =
            "Hmm... Böyle bir ördek tanımıyorum🦆";

        message.classList.remove("found");

    }

}


/* ENTER TUŞUYLA DA AÇ */

document
    .getElementById("duckCode")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                openDuck();

            }

        }
    );

</script>


</body>
</html>
